services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: stockflow
      MYSQL_USER: stockflow
      MYSQL_PASSWORD: stockflow
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-ustockflow", "-pstockflow"]
      interval: 5s
      timeout: 5s
      retries: 15

  api:
    build: .
    env_file: .env
    ports:
      - "3333:3333"
    depends_on:
      mysql:
        condition: service_healthy
    command: sh -c "npm run db:migrate && npm run db:seed && npm start"

volumes:
  mysql_data:
